[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mufsi"
version = "3.0.0.dev0"
description = "Viscous fluid-structure interaction for micro- and nanomechanical resonators"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Install DOLFINx/PETSc/SLEPc together in the scientific environment.
dependencies = ["numpy>=1.26", "scipy>=1.14"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mufsi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires the scientific computing environment, including DOLFINx",
    "regression: compares results against independently verified reference data",
]

[tool.ruff]
line-length = 88
target-version = "py311"
