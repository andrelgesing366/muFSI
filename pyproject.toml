[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mufsi"
version = "3.0.0.dev0"
description = "Viscous fluid-structure interaction for micro- and nanomechanical resonators"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Add numerical dependencies when their implementations and supported versions
# have been established. The initial skeleton uses only the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mufsi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires the scientific computing environment, including DOLFINx",
    "regression: compares results against independently verified reference data",
]

[tool.ruff]
line-length = 88
target-version = "py311"
